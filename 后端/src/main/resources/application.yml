spring:
  application:
    name: museum-ticket-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/museum_ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jackson:
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-at-least-32-characters}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}
  order:
    expiration-scan-milliseconds: ${ORDER_EXPIRATION_SCAN_MILLISECONDS:60000}
